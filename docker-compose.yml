
services:

  # =====================================================
  # MAIN BACKEND
  # =====================================================

  main-backend:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-main:latest
    build:
      context: ./backend
      dockerfile: ../docker/main.Dockerfile
    container_name: main-backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - account-agent
      - transaction-agent
      - card-agent
      - rag-agent
    networks:
      - banking-network


  # =====================================================
  # ACCOUNT
  # =====================================================

  account-service:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-account-service:latest
    build:
      context: ./backend
      dockerfile: ../docker/services/account.Dockerfile
    container_name: account-service
    env_file:
      - .env.docker
    ports:
      - "8101:8101"
    networks:
      - banking-network

  account-mcp:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-account-mcp:latest
    build:
      context: ./backend
      dockerfile: ../docker/mcp/account.Dockerfile
    container_name: account-mcp
    env_file:
      - .env.docker
    ports:
      - "8001:8001"
    depends_on:
      - account-service
    networks:
      - banking-network

  account-agent:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-account-agent:latest
    build:
      context: ./backend
      dockerfile: ../docker/agents/account.Dockerfile
    container_name: account-agent
    env_file:
      - .env.docker
    ports:
      - "8201:8201"
    depends_on:
      - account-mcp
    networks:
      - banking-network


  # =====================================================
  # TRANSACTION
  # =====================================================

  transaction-service:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-transaction-service:latest
    build:
      context: ./backend
      dockerfile: ../docker/services/transaction.Dockerfile
    container_name: transaction-service
    env_file:
      - .env.docker
    ports:
      - "8102:8102"
    networks:
      - banking-network

  transaction-mcp:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-transaction-mcp:latest
    build:
      context: ./backend
      dockerfile: ../docker/mcp/transaction.Dockerfile
    container_name: transaction-mcp
    env_file:
      - .env.docker
    ports:
      - "8002:8002"
    depends_on:
      - transaction-service
    networks:
      - banking-network

  transaction-agent:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-transaction-agent:latest
    build:
      context: ./backend
      dockerfile: ../docker/agents/transaction.Dockerfile
    container_name: transaction-agent
    env_file:
      - .env.docker
    ports:
      - "8202:8202"
    depends_on:
      - transaction-mcp
    networks:
      - banking-network


  # =====================================================
  # CARD
  # =====================================================

  card-service:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-card-service:latest
    build:
      context: ./backend
      dockerfile: ../docker/services/card.Dockerfile
    container_name: card-service
    env_file:
      - .env.docker
    ports:
      - "8103:8103"
    networks:
      - banking-network

  card-mcp:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-card-mcp:latest
    build:
      context: ./backend
      dockerfile: ../docker/mcp/card.Dockerfile
    container_name: card-mcp
    env_file:
      - .env.docker
    ports:
      - "8003:8003"
    depends_on:
      - card-service
    networks:
      - banking-network

  card-agent:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-card-agent:latest
    build:
      context: ./backend
      dockerfile: ../docker/agents/card.Dockerfile
    container_name: card-agent
    env_file:
      - .env.docker
    ports:
      - "8203:8203"
    depends_on:
      - card-mcp
    networks:
      - banking-network


  # =====================================================
  # RAG
  # =====================================================

  rag-service:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-rag-service:latest
    build:
      context: ./backend
      dockerfile: ../docker/services/rag.Dockerfile
    container_name: rag-service
    env_file:
      - .env.docker
    ports:
      - "8104:8104"
    networks:
      - banking-network

  rag-mcp:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-rag-mcp:latest
    build:
      context: ./backend
      dockerfile: ../docker/mcp/rag.Dockerfile
    container_name: rag-mcp
    env_file:
      - .env.docker
    ports:
      - "8004:8004"
    depends_on:
      - rag-service
    networks:
      - banking-network

  rag-agent:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-rag-agent:latest
    build:
      context: ./backend
      dockerfile: ../docker/agents/rag.Dockerfile
    container_name: rag-agent
    env_file:
      - .env.docker
    ports:
      - "8204:8204"
    depends_on:
      - rag-mcp
    networks:
      - banking-network

    # =====================================================
  # AGENT WORKER
  # =====================================================

  agent-worker:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-agent-worker:latest
    build:
      context: ./backend
      dockerfile: ../docker/agent-worker.Dockerfile
    container_name: agent-worker
    env_file:
      - .env.docker
    command:
      - python
      - -m
      - app.worker.worker
    depends_on:
      - account-agent
      - transaction-agent
      - card-agent
      - rag-agent
    networks:
      - banking-network

    # =====================================================
  # OPENTELEMETRY COLLECTOR
  # =====================================================

  otel-collector:
    platform: linux/amd64
    image: 131404648821.dkr.ecr.us-east-1.amazonaws.com/banking-otel-collector:latest
    build:
      context: ./otel
      dockerfile: Dockerfile
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

  